<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - On Love</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:white;text-align:center}
.logo{font-size:28px;font-weight:bold;color:#ff2e63;padding:20px}
.box{background:#1a1a1a;padding:30px;border-radius:20px;max-width:350px;margin:20px auto}
input{width:90%;padding:15px;margin:10px;border-radius:10px;border:none;font-size:16px}
button{background:#ff2e63;color:white;padding:15px;width:95%;border:none;border-radius:20px;font-size:18px;cursor:pointer}
a{color:#ff2e63}
</style>
</head>
<body>
<div class="logo">On Love 💕</div>
<div class="box">
<h2>Bienvenue ! 😍</h2>
<p>Connecte-toi pour discuter</p>
<input type="email" id="email" placeholder="Ton email 📧">
<input type="password" id="mdp" placeholder="Ton mot de passe 🔒">
<button onclick="connecter()">Se Connecter</button>
<p id="msg"></p>
<p>Pas encore de compte ? <a href="inscription.html">Crée un compte</a></p>
<p><a href="index.html">← Retour à l'accueil</a></p>
</div>
<script>
function connecter(){
  var email = document.getElementById('email').value;
  var mdp = document.getElementById('mdp').value;
  if(email=="" || mdp==""){ document.getElementById('msg').innerHTML="⚠️ Remplis email + mot de passe"; return; }
  document.getElementById('msg').innerHTML="✅ Connexion réussie ! Bienvenue "+email+" 💕";
  setTimeout(function(){ window.location.href="index.html"; }, 2000);
}
</script>
</body>
</html>
